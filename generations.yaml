    description: "The Volkswagen ID. Buzz represents a modern, all-electric reinterpretation of the iconic Type 2 Microbus (VW Bus), combining retro-inspired design elements with Volkswagen's latest electric vehicle technology. Built on the dedicated MEB electric platform, the ID. Buzz features distinctive two-tone paint options, short front and rear overhangs, large side windows, and an overall silhouette that clearly evokes its predecessor. Initially launched in passenger (ID. Buzz) and cargo (ID. Buzz Cargo) variants, with short-wheelbase (SWB) and later long-wheelbase (LWB) configurations. The SWB/RWD version features a rear-mounted APP 310 motor producing 201 hp (150 kW) and 229 lb-ft of torque, paired with a 77 kWh usable lithium-ion battery providing approximately 250 miles (WLTP) range. DC fast charging at up to 170 kW enables 5-80% charge in approximately 30 minutes. The LWB version offers an upgraded APP 550 traction motor with 282 hp (210 kW), larger 85 kWh battery, and optional AWD GTX variant with 335 hp combined output. The passenger version offers five or seven-seat configurations, while the Cargo variant provides up to 137.7 cubic feet of load space."